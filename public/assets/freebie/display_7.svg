<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="700" height="950" style="background:#FAF8F2; font-family:'Georgia', serif;">
    <!-- Document Card Background & Border -->
    <rect width="700" height="950" fill="#FCFAF5" stroke="#E2DCD0" stroke-width="2"/>
    
    <!-- Top Meta Tag -->
    <text x="60" y="70" font-family="'Space Grotesk', monospace, sans-serif" font-size="11" letter-spacing="3" fill="#8C7A58">07  /  TRUST</text>
    <line x1="60" y1="85" x2="640" y2="85" stroke="#A68D5D" stroke-width="1.5" />
    
    <!-- Large Heading -->
    <text x="60" y="145" font-family="'Cinzel', 'Times New Roman', serif" font-weight="bold" font-size="34" letter-spacing="1" fill="#1A1815">WHY I BUILT THIS</text>
    
    <!-- Subtitle -->
    <text x="60" y="180" font-style="italic" font-size="16" fill="#595245">I did not arrive at this philosophy from a comfortable place.</text>
    
    <!-- Rule bar / Table Header -->
    <rect x="60" y="215" width="580" height="34" fill="#EFE8D8" rx="2" stroke="#DFD4BE"/>
    <text x="75" y="238" font-family="'Space Grotesk', monospace, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5" fill="#544834">01 THE ACCIDENT | 02 THE COLLAPSE | 03 THE AUDIT | 04 THE REBUILD</text>
    
    <!-- Teaser Line 1 -->
    <text x="60" y="285" font-size="14" fill="#2E2A24">An accident took the use of my legs during COVID.</text>
    <line x1="60" y1="300" x2="640" y2="300" stroke="#EFE9DC" stroke-width="1"/>
    
    <!-- Teaser Line 2 -->
    <text x="60" y="335" font-size="14" fill="#3D372E">Lost a global business worth over ¥28 million in crisis.</text>
    <line x1="60" y1="350" x2="640" y2="350" stroke="#EFE9DC" stroke-width="1"/>
    
    <!-- Teaser Line 3 -->
    <text x="60" y="385" font-size="13" fill="#524A3E">Stopped relying on motivation. Looked at the facts.</text>
    <line x1="60" y1="400" x2="640" y2="400" stroke="#EFE9DC" stroke-width="1"/>

    <!-- Teaser Line 4 -->
    <text x="60" y="435" font-size="13" fill="#524A3E">Chose what mattered. Executed. Repeated.</text>
    <line x1="60" y1="450" x2="640" y2="450" stroke="#EFE9DC" stroke-width="1"/>
    
    <!-- Document Footer -->
    <text x="60" y="910" font-family="'Space Grotesk', monospace" font-size="10" letter-spacing="2" fill="#A89B84">BEFORE THE YEAR ENDS  ·  THE BROKEN PROMISES AUDIT</text>
    <text x="610" y="910" font-family="'Space Grotesk', monospace" font-size="11" font-weight="bold" fill="#8C7A58">7 / 8</text>
  </svg>